# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - HelpdeskVerifiedIDPOC

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish Woodgrove Helpdesk
        run: dotnet publish ./6-woodgrove-helpdesk/WoodgroveHelpdesk.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Create deployment package
        shell: powershell
        run: Compress-Archive -Path "${{ github.workspace }}/publish/*" -DestinationPath "${{ github.workspace }}/woodgrove.zip"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: woodgrove-package
          path: ${{ github.workspace }}/woodgrove.zip

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: woodgrove-package
          path: ./deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DDCBB20366DE46BFAAFEA91D07EAE53A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_302CB2106E39438F936CC7FA01C2F38C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D2F4EB9A59674F6F8E4DE9CE64B87A0E }}

      - name: Deploy Woodgrove Helpdesk to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HelpdeskVerifiedIDPOC'
          slot-name: 'Production'
          package: ./deployment/woodgrove.zip
          slot-name: 'Production'
          package: ./publish
